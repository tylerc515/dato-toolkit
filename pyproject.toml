[project]
name = "dato-toolkit"
version = "2.6.1"
description = "DATO Toolkit is a suite of field operations tools for NDE inspection teams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "tylerc515" }
]
dependencies = [
    "PyQt6>=6.6.0",
    "qtawesome",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.1",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.21.0"]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.pages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
